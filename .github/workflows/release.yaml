name: release
run-name: Release ${{ github.ref_name }}
cache-mode: none
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - platform: macos-latest
            tauri-args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    env:
      MISE_ENV: ${{ matrix.platform == 'macos-latest' && 'ci,macos' || 'ci' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Rust Environment
        uses: './.github/actions/setup-pnpm-rust'
        with:
          runner-platform: ${{ matrix.platform }}

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: 'pnpm tauri'
          args: ${{ matrix.tauri-args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: false
