name: 'test-build'
on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/renovate.json'
      - '.github/workflows/release.yaml'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '*.md'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v5.0.0

  test-build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - platform: macos-latest
            tauri-args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    env:
      MISE_ENV: ${{ matrix.platform == 'macos-latest' && 'ci,macos' || 'ci' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Rust Environment
        uses: './.github/actions/setup-pnpm-rust'
        with:
          runner-platform: ${{ matrix.platform }}

      - name: Lint files (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          mise lint --all

      - name: Run unit tests
        run: |
          mise test

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tauriScript: 'pnpm tauri'
          args: ${{ matrix.tauri-args }}
