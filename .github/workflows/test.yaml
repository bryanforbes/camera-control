name: 'test-build'
on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/renovate.json'
      - '.github/workflows/release.yaml'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '*.md'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0

  test-build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin, x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Rust Environment
        uses: './.github/actions/setup-pnpm-rust'
        with:
          rust-targets: ${{ matrix.rust-targets }}
          runner-platform: ${{ matrix.platform }}
          github-ref: ${{ github.ref }}

      - name: Lint files (macOS only)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps
          pnpm check
          pnpm lint

      - name: Run unit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.tauri-args }}
