name: 'Setup pnpm and Rust Environment'
description: 'Set up pnpm and Rust environment for building and testing'
inputs:
  rust-targets:
    description: 'Comma-separated list of Rust targets to install'
    required: false
    default: ''
  runner-platform:
    description: 'The platform of the runner (e.g., ubuntu-latest, macos-latest, windows-latest)'
    required: true
  github-ref:
    description: 'The GitHub ref (branch or tag) for conditional caching'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}
        components: 'clippy'

    - uses: pnpm/action-setup@v6
      name: Install pnpm
      id: pnpm-install
      with:
        run_install: false

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'

    - name: Install dependencies (ubuntu only)
      if: startsWith(inputs.runner-platform, 'ubuntu-')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

    - uses: Swatinem/rust-cache@v2
      name: Set up Rust cache
      with:
        workspaces: src-tauri
        key: ${{ inputs.runner-platform }}
        save-if: ${{ inputs.github-ref == 'refs/heads/master' }}

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
