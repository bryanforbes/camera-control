productName = "Camera Control"
mainBinaryName = "Camera Control"
version = "26.10.3-0"
identifier = "net.reigndropsfall.camera-control"

[build]
beforeDevCommand = "pnpm dev"
beforeBuildCommand = "pnpm build"
frontendDist = "../build"
devUrl = "http://localhost:1420"

[bundle]
active = true
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico"
]
targets = "all"
createUpdaterArtifacts = true

[app]
withGlobalTauri = true

[[app.windows]]
title = "Camera Control"
label = "main"
fullscreen = false
resizable = false
visible = false  # see +layout.svelte for explanation
acceptFirstMouse = true
width = 350
height = 450
useHttpsScheme = true

[[app.windows]]
title = "Camera Control Settings"
label = "settings"
url = "/settings"
create = false
fullscreen = false
resizable = false
visible = false  # see +layout.svelte for explanation
acceptFirstMouse = true
width = 600
height = 500
useHttpsScheme = true

[app.security]
freezePrototype = true

[app.security.csp]
default-src = "'self'"
connect-src = "'self' ipc: http://ipc.localhost"
style-src = "'unsafe-inline' 'self'"

[app.security.pattern]
use = "isolation"

[app.security.pattern.options]
dir = "../dist-isolation"

[plugins.updater]
pubkey = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDkxOTUxRkM5QkY1QzQ2N0QKUldSOVJseS95UitWa1NvNXp6Z1N1VUF6YXVCZzUwTTdMV3NPTldIdEF6cno3d0x4MHczdGJwK0sK"
endpoints = ["https://github.com/bryanforbes/camera-control/releases/latest/download/latest.json"]
