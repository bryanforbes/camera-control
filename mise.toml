[tools]
"cargo:tauri-cli" = "2.12.4"
hk = { version = "2.11.1", workflow = "release.yml" }
jactionlint = { version = "v2.5.0", workflow = "release.yaml" }
node = "26.13.0"
pkl = "0.33.0"
pnpm = "12.18.0"

[tools.rust]
version = "stable"
components = ["clippy"]

[hooks]
postinstall = '''
mise run pnpm-install
hk install --mise
'''

[env]
_.path = ['./node_modules/.bin']

[tasks.dev]
description = "Run the Tauri development server"
depends = ["pnpm-install"]
run = 'cargo tauri dev'

[tasks.build]
description = "Build the Tauri application"
depends = ["pnpm-install"]
run = 'cargo tauri build{% if vars.tauri_target is defined %} --target {{ vars.tauri_target }}{% endif %}'

[tasks.pnpm-install]
description = "Initialize node modules"
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.lint]
description = "Lint code"
depends = ["pnpm-install"]
run = 'hk check'

[tasks.lint-frontend]
description = "Lint frontend code"
depends = ["pnpm-install"]
run = 'hk check --profile frontend'

[tasks.lint-backend]
description = "Lint backend code"
run = 'hk check --profile backend'

[tasks.fix]
description = "Fix code"
depends = ["pnpm-install"]
run = 'hk fix'

[tasks.test]
description = "Run tests"
run = 'cargo test --manifest-path src-tauri/Cargo.toml'

[tasks.probe]
description = "Run VISCA probe"
usage = '''
flag "--port <port>" required=#true
flag "--log-file <log-file>"
flag "--baud <baud>" default="9600"
flag "--address <address>" default="1"
flag "--timeout-ms <timeout-ms>" default="500"
arg "<mode>" required=#true {
  choices "baseline" "overlap"
}
arg "<motion>" required=#true {
  choices "pan" "zoom"
}
'''
run = '''
cargo run --locked --manifest-path tools/visca-probe/Cargo.toml -- \
  --port ${usage_port:?} \
  --baud ${usage_baud:?} \
  --address ${usage_address:?} \
  --timeout-ms ${usage_timeout_ms:?} \
  ${usage_log_file:+--log-file} ${usage_log_file:+"$usage_log_file"} \
  ${usage_mode:?} \
  ${usage_motion:?}
'''
